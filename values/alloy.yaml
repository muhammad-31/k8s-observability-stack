# Grafana Alloy as a DaemonSet shipping pod logs to Loki.
# The pipeline itself lives in alloy/config.alloy (validated in CI) and is
# delivered as the "alloy-config" ConfigMap by the Kustomization at the repo root.
alloy:
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  enableReporting: false
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: CLUSTER_NAME
      value: dev
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

controller:
  type: daemonset
