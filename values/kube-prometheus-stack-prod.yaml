prometheus:
  prometheusSpec:
    replicas: 2
    retention: 30d
    retentionSize: 180GB
    externalLabels:
      cluster: prod
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 8Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 200Gi

alertmanager:
  alertmanagerSpec:
    # Alertmanager instances gossip and deduplicate notifications.
    replicas: 3

grafana:
  # Users, sessions and annotations live in Grafana's SQLite database on each
  # pod, so a second replica would show different state. Scale out only with
  # a shared database (grafana.ini [database]). Dashboards are provisioned
  # from ConfigMaps, so a restart loses nothing important.
  replicas: 1
