prometheus:
  prometheusSpec:
    replicas: 2
    retention: 30d
    retentionSize: 180GB
    externalLabels:
      cluster: prod
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 8Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 200Gi

alertmanager:
  alertmanagerSpec:
    # Alertmanager instances gossip and deduplicate notifications.
    replicas: 3

grafana:
  replicas: 2
