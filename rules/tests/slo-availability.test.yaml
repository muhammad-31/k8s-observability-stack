# promtool unit tests for the SLO rules. Run with: make test-rules
rule_files:
  - ../../build/rules/slo-availability.yaml

evaluation_interval: 1m

tests:
  - name: healthy service raises nothing
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="200"}'
        values: '0+600x240'
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="500"}'
        values: '0+0x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: ErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 3h
        alertname: ErrorBudgetBurnSlow
        exp_alerts: []

  - name: 20 percent errors pages within minutes
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="200"}'
        values: '0+480x120'
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="500"}'
        values: '0+120x120'
    promql_expr_test:
      - expr: slo:http_errors:ratio_rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'slo:http_errors:ratio_rate5m{namespace="shop", job="podinfo"}'
            value: 0.2
    alert_rule_test:
      - eval_time: 30m
        alertname: ErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              namespace: shop
              job: podinfo
              severity: page
              slo: availability-99.9
            exp_annotations:
              summary: "podinfo in shop is burning its error budget fast"
              description: >-
                At this error rate the 30-day error budget is gone in less than two days.
                Error ratio over the long alert window: 20%.
              runbook_url: https://github.com/muhammad-31/k8s-observability-stack/blob/main/runbooks/ErrorBudgetBurn.md

  - name: half a percent of errors opens a ticket but does not page
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="200"}'
        values: '0+995x300'
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="503"}'
        values: '0+5x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: ErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 4h
        alertname: ErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              namespace: shop
              job: podinfo
              severity: ticket
              slo: availability-99.9
            exp_annotations:
              summary: "podinfo in shop is slowly burning its error budget"
              description: "Errors are above the SLO for hours. No emergency yet, but the monthly budget will run out before the window ends if this continues."
              runbook_url: https://github.com/muhammad-31/k8s-observability-stack/blob/main/runbooks/ErrorBudgetBurn.md

  - name: a 10 minute outage pages, and the page clears soon after recovery
    interval: 1m
    input_series:
      # healthy for 1h, 10 minutes at 50% errors, then healthy again
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="200"}'
        values: '0+600x60 36300+300x10 39900+600x60'
      - series: 'http_request_duration_seconds_count{namespace="shop", job="podinfo", status="500"}'
        values: '0+0x60 300+300x10 3300+0x60'
    alert_rule_test:
      - eval_time: 70m
        alertname: ErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              namespace: shop
              job: podinfo
              severity: page
              slo: availability-99.9
            exp_annotations:
              summary: "podinfo in shop is burning its error budget fast"
              description: "At this error rate the 30-day error budget is gone in less than two days. Error ratio over the long alert window: 8.345%."
              runbook_url: https://github.com/muhammad-31/k8s-observability-stack/blob/main/runbooks/ErrorBudgetBurn.md
      # The short windows (5m, 30m) stop the alert from firing for hours after
      # the incident is over, even though the long windows still show errors.
      - eval_time: 110m
        alertname: ErrorBudgetBurnFast
        exp_alerts: []
