# Alertmanager routing. Credentials are never in this file: receivers read them
# from the "alertmanager-receivers" Secret, mounted by the Alertmanager pods at
# /etc/alertmanager/secrets/alertmanager-receivers/ (see values and README).
#
#   page / critical -> PagerDuty + #incidents
#   ticket / warning -> #alerts
#   Watchdog -> dead man's switch (alerts if Alertmanager itself stops sending)
#   info -> dropped (visible in Prometheus and Grafana only)
global:
  resolve_timeout: 5m

route:
  receiver: slack-alerts
  group_by: [alertname, namespace, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: deadmans-switch
      matchers: ['alertname = "Watchdog"']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    - receiver: blackhole
      matchers: ['alertname = "InfoInhibitor"']

    - receiver: pagerduty
      matchers: ['severity =~ "page|critical"']
      repeat_interval: 1h
      continue: true

    - receiver: slack-incidents
      matchers: ['severity =~ "page|critical"']
      repeat_interval: 1h

    - receiver: slack-alerts
      matchers: ['severity =~ "ticket|warning"']

    - receiver: blackhole
      matchers: ['severity = "info"']

inhibit_rules:
  # A page already covers the same problem; do not also send the ticket.
  - source_matchers: ['severity =~ "page|critical"']
    target_matchers: ['severity =~ "ticket|warning"']
    equal: [namespace, alertname]
  - source_matchers: ['alertname = "ErrorBudgetBurnFast"']
    target_matchers: ['alertname = "ErrorBudgetBurnSlow"']
    equal: [namespace, job]

receivers:
  - name: blackhole

  - name: deadmans-switch
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/alertmanager-receivers/deadmans-switch-url
        send_resolved: false

  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/alertmanager-receivers/pagerduty-routing-key
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        links:
          - href: '{{ .CommonAnnotations.runbook_url }}'
            text: Runbook

  - name: slack-incidents
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url
        channel: '#incidents'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}*{{ .Labels.alertname }}* ({{ .Labels.severity }}) {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}<{{ .Annotations.runbook_url }}|Runbook>{{ end }}
          {{ end }}

  - name: slack-alerts
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url
        channel: '#alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }} {{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}*{{ .Labels.alertname }}* ({{ .Labels.severity }}) {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}<{{ .Annotations.runbook_url }}|Runbook>{{ end }}
          {{ end }}
