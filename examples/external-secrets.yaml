# Example: pull the two required Secrets from AWS Secrets Manager with the
# External Secrets Operator instead of creating them by hand.
# Assumes a ClusterSecretStore named "aws-secrets-manager" already exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-receivers
  data:
    - secretKey: slack-webhook-url
      remoteRef: {key: observability/alertmanager, property: slack_webhook_url}
    - secretKey: pagerduty-routing-key
      remoteRef: {key: observability/alertmanager, property: pagerduty_routing_key}
    - secretKey: deadmans-switch-url
      remoteRef: {key: observability/alertmanager, property: deadmans_switch_url}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef: {key: observability/grafana, property: admin_user}
    - secretKey: admin-password
      remoteRef: {key: observability/grafana, property: admin_password}
